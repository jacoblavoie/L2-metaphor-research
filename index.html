<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metaphor Recognition Study</title>


  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-initialize-microphone@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-audio-response@2.1.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css">

  <style>
    body {
      background: #fafafa;
      font-family: Arial, Helvetica, sans-serif;
    }
    .study-wrap {
      max-width: 920px;
      margin: 0 auto;
      line-height: 1.65;
      font-size: 18px;
    }
    .instruction-box,
    .passage-box,
    .underline-target {
      border: 1px solid #ddd;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
      text-align: left;
    }
    .passage-box,
    .underline-target {
      white-space: pre-wrap;
    }
    .trial-header {
      margin-bottom: 14px;
      font-size: 15px;
      color: #666;
    }
    .language-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef3ff;
      color: #335;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .meta-tools {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 18px 0;
      justify-content: center;
    }
    .meta-tools button {
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #bbb;
      background: white;
      cursor: pointer;
    }
    .meta-tools button:hover {
      background: #f2f2f2;
    }
    /* Sticky toolbar for the underlining trial only: keeps the
       Underline / Clear / Continue buttons visible while the participant
       scrolls through a long passage. */
    .meta-tools-sticky {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fafafa;            /* matches page bg so text doesn't show through */
      margin: 0 0 12px 0;
      padding: 10px 0;
      border-bottom: 1px solid #e2e2e2;
    }
    /* Per-instance reasoning checklist. Compact rows: checkbox + label text
       on one line via flex, with line-height/margins forced past the jsPsych
       default stylesheet (which otherwise inflates the spacing). */
    .study-wrap .reason-block {
      margin: 0 0 14px 0 !important;
      line-height: 1.35 !important;
    }
    .study-wrap .reason-block .reason-segment { margin: 0 0 4px 0 !important; line-height: 1.35 !important; }
    .study-wrap .reason-block .reason-q       { margin: 0 0 8px 0 !important; line-height: 1.35 !important; }
    .study-wrap .reason-block .reason-option {
      display: flex !important;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      margin: 4px 0 !important;
      line-height: 1.35 !important;
      cursor: pointer;
    }
    .study-wrap .reason-block .reason-option input[type="checkbox"] {
      margin: 3px 0 0 0;          /* nudge box to align with first text line */
      flex: 0 0 auto;
    }
    .study-wrap .reason-block .reason-option .reason-text {
      flex: 1 1 auto;
      line-height: 1.35 !important;
    }
    .study-wrap .reason-block .reason-other {
      display: block !important;
      margin-top: 10px !important;
    }
    .study-wrap .reason-block .reason-other textarea {
      width: 100%;
      margin-top: 4px;
      display: block;
    }
    .underlined {
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 3px;
      background: rgba(255, 235, 59, 0.22);
    }
    /* Coded-metaphor markers must be invisible to the reader: inherit all
       text properties from the surrounding prose, no color/underline/bg. */
    #underline-target span[data-met] {
      all: unset;
    }
    .small-note {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
      text-align: left;
    }
    .recording-indicator {
  display: inline-block;
  width: 14px;
  height: 14px;
  background: #d00;
  border-radius: 50%;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.45;
    transform: scale(1.15);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
  </style>
</head>
<body>
  <noscript>This study requires JavaScript to run.</noscript>

  <!-- Stimulus files -->
  <!-- Stimulus file (combined: defines STIM_HV1, STIM_HV2, STIM_LV1, STIM_LV2) -->
  <script src="stimuli.js"></script>

  <!-- Main experiment logic -->
  <script src="experiment.js"></script>
</body>
</html>
